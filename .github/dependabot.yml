version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    commit-message:
      prefix: "build"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Europe/London"
    open-pull-request-limit: 10
    labels:
      - "dependencies"
    groups:
      production:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      development-tooling:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

    cooldown:
      default-days: 5

  - package-ecosystem: "docker"
    directory: "/"
    commit-message:
      prefix: "build"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
